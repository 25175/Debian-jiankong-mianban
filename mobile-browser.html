<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机控制 VM 浏览器</title><style>
:root{--bg:#07111f;--panel:#102039;--line:#294464;--text:#edf5ff;--muted:#9bb0cd;--blue:#3287e8;--good:#44dea3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC",sans-serif}.wrap{max-width:900px;margin:auto;padding:14px}.bar,.card{background:linear-gradient(145deg,#142743,#0d1a2d);border:1px solid var(--line);border-radius:14px;padding:12px}.bar{position:sticky;top:0;z-index:2;display:flex;gap:8px;flex-wrap:wrap}.btn,input{font:inherit;border-radius:9px;border:1px solid #3b5c82;padding:10px;color:var(--text);background:#0a1728}.btn{cursor:pointer;background:#1b4779}.btn.primary{background:var(--blue);border-color:#65adff}.btn:disabled{opacity:.5}.wide{flex:1;min-width:180px}.status{color:var(--muted);padding:8px 2px;min-height:24px}.screen{margin-top:12px;text-align:center;background:#02070d;border:1px solid var(--line);border-radius:14px;padding:8px;min-height:260px}.screen img{max-width:100%;height:auto;display:block;margin:auto;border-radius:8px}.text{margin-top:12px;white-space:pre-wrap;word-break:break-word;color:#c8d8ed;max-height:180px;overflow:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.help{color:var(--muted);font-size:13px;line-height:1.5}@media(max-width:520px){.actions{grid-template-columns:1fr}.bar .btn{flex:1}}
</style><body><main class="wrap"><section class="bar"><button class="btn" onclick="go('back')">← 返回</button><button class="btn" onclick="go('refresh')">刷新 VM 页面</button><button class="btn" onclick="go('home')">MonkeyCode</button><button class="btn primary" onclick="sync()">登录完成后同步</button></section><div id="status" class="status">正在连接 VM Chromium…</div><section class="card"><h2>VM 登录方式</h2><p class="help">选择登录方式并填写账号密码；凭据只在本次请求中传给 VM Chromium，不写入服务器。OAuth/GitHub 回调始终留在 VM 浏览器内。</p><div class="actions"><select id="loginMode" class="wide"><option value="password">MonkeyCode 账号密码登录</option><option value="baizhi">百智云登录</option><option value="github">百智云 → GitHub 登录</option></select><input id="loginAccount" autocomplete="username" placeholder="账号 / 邮箱"><input id="loginPassword" type="password" autocomplete="current-password" placeholder="密码"><button class="btn primary" onclick="autoLogin()">自动进入并登录</button></div></section><section class="card"><p class="help">手机控制 VM Chromium，GitHub 回调仍发生在 VM 浏览器内，不把手机 Cookie 转移到 VM。</p><div class="actions"><input id="clickText" placeholder="点击页面文字，如：GitHub 登录"><button class="btn" onclick="clickText()">点击文字控件</button><input id="typeText" placeholder="输入到当前焦点"><button class="btn" onclick="typeText()">发送输入</button><input id="url" class="wide" placeholder="仅输入 https:// 地址"><button class="btn" onclick="navigate()">在 VM 打开</button><button class="btn" onclick="key('Enter')">回车</button><button class="btn" onclick="key('Tab')">Tab</button></div></section><section class="screen"><img id="screen" alt="VM Chromium 实时画面"><div id="text" class="text"></div></section></main><script>
const $=id=>document.getElementById(id);let busy=false;async function autoLogin(){const mode=$('loginMode').value,account=$('loginAccount').value,password=$('loginPassword').value;if(mode==='password'&&(!account||!password))return say('账号密码登录需要填写账号和密码',true);try{say('正在让 VM Chromium 自动进入所选登录方式…');await api('/api/mobile-browser/action',{method:'POST',body:JSON.stringify({action:'auto_login',mode,account,password})});$('loginPassword').value='';setTimeout(load,1200)}catch(e){say(e.message,true)}}async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}function say(x,bad=false){$('status').textContent=x;$('status').style.color=bad?'#ff8795':'#9bb0cd'}async function load(){if(busy)return;busy=true;try{const d=await api('/api/mobile-browser/state');$('screen').src='data:image/jpeg;base64,'+d.image;$('text').textContent=d.text||'';say(`${d.title||'VM Chromium'} · ${d.url||''}`)}catch(e){say(e.message,true)}finally{busy=false}}async function go(action){try{await api('/api/mobile-browser/action',{method:'POST',body:JSON.stringify({action})});await load()}catch(e){say(e.message,true)}}async function clickText(){const value=$('clickText').value.trim();if(!value)return say('请输入页面上的按钮文字',true);try{await api('/api/mobile-browser/action',{method:'POST',body:JSON.stringify({action:'click_text',value})});$('clickText').value='';setTimeout(load,700)}catch(e){say(e.message,true)}}async function typeText(){const value=$('typeText').value;if(!value)return;try{await api('/api/mobile-browser/action',{method:'POST',body:JSON.stringify({action:'type',value})});$('typeText').value='';setTimeout(load,500)}catch(e){say(e.message,true)}}async function key(value){try{await api('/api/mobile-browser/action',{method:'POST',body:JSON.stringify({action:'key',value})});setTimeout(load,500)}catch(e){say(e.message,true)}}async function navigate(){const value=$('url').value.trim();if(!/^https:\/\//i.test(value))return say('只允许打开 HTTPS 地址',true);try{await api('/api/mobile-browser/action',{method:'POST',body:JSON.stringify({action:'navigate',value})});setTimeout(load,1200)}catch(e){say(e.message,true)}}async function sync(){try{say('正在读取 VM Cookie 并验证 Worker…');const d=await api('/api/login-browser/sync',{method:'POST'});say(d.ok?'已同步并通过 Worker/Task 验证':'同步失败：'+(d.worker?.error||d.error||'未通过'),!d.ok)}catch(e){say(e.message,true)}}load();setInterval(load,5000)</script></body></html>
