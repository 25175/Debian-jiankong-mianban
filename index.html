<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Debian 服务监控面板</title><link rel="icon" type="image/svg+xml" href="/icon.svg?v=2"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2"><meta name="theme-color" content="#bdb4ff"><style>
:root{--bg:#09111f;--panel:#101c30;--line:#243653;--text:#ecf3ff;--muted:#8fa1be;--good:#3ee7a3;--bad:#ff7785;--idle:#f5bd66}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 10% -10%,#1b3e70,transparent 63%),radial-gradient(850px 450px at 100% 0,#1e3457,transparent 65%),var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}.shell{max-width:1260px;margin:auto;padding:36px 26px 52px}.eyebrow{color:#86aef0;font-size:12px;font-weight:750;letter-spacing:.13em;text-transform:uppercase}.hero{display:flex;justify-content:space-between;gap:26px;align-items:flex-start;padding-bottom:28px}.hero h1{font-size:clamp(29px,5vw,44px);line-height:1.1;margin:9px 0 10px;letter-spacing:-.04em}.hero p{margin:0;color:var(--muted);max-width:650px}.health{min-width:210px;border:1px solid #286451;background:#112e30cc;border-radius:18px;padding:16px 18px}.health.bad{border-color:#6a3745;background:#321e29cc}.health small{display:block;color:#9db9b5;margin-bottom:6px}.health strong{font-size:17px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#0d1829b8;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:25px}input{flex:1;min-width:250px;background:#091323;border:1px solid #2a4265;color:var(--text);border-radius:10px;padding:11px 13px;outline:none}input:focus{border-color:#5d9dff;box-shadow:0 0 0 3px #3775bb33}.notice{color:var(--muted);font-size:13px;min-height:18px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #385372;border-radius:10px;background:#182942;color:#eaf2ff;padding:9px 12px;cursor:pointer;text-decoration:none;font:inherit;white-space:nowrap}.btn:hover{background:#233b61}.btn.primary{border-color:#3b86e8;background:#2865b5}.btn.primary:hover{background:#3477cd}.btn.danger{border-color:#824a5a;background:#32202b;color:#ffc0c8}.section-head{display:flex;align-items:end;justify-content:space-between;margin:29px 0 12px}.section-head h2{font-size:18px;margin:0}.section-head span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 4;position:relative;overflow:hidden;background:linear-gradient(145deg,#14223a,#0e182a);border:1px solid var(--line);border-radius:17px;padding:18px;min-height:165px}.card.lead{grid-column:span 6;min-height:205px}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bad)}.card.ok:before{background:var(--good)}.card.neutral:before{background:var(--idle)}.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:18px;font-weight:720}.tag{font-size:12px;border-radius:999px;padding:5px 9px;background:#482330;color:#ffadb6;font-weight:700}.ok .tag{background:#103b35;color:#83f2c3}.neutral .tag{background:#45371f;color:#ffd890}.desc{margin:12px 0;color:var(--muted);line-height:1.55;min-height:43px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 15px}.pill{border:1px solid #2c4260;border-radius:999px;padding:4px 8px;font-size:12px;color:#afbed6;background:#101d31}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.subnote{color:#8092af;font-size:12px;margin-top:10px}.modal{position:fixed;inset:0;display:none;z-index:3;background:#020814bb;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal-box{width:min(760px,100%);max-height:88vh;overflow:auto;background:#101c30;border:1px solid #334c70;border-radius:18px;padding:22px}.modal-box h3{margin:0 0 9px}.modal-box p{color:var(--muted);line-height:1.55}.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}pre{margin:16px 0 0;padding:14px;background:#070e1a;border:1px solid #20314b;border-radius:10px;white-space:pre-wrap;word-break:break-word;max-height:55vh;overflow:auto;color:#c8d6ec;font:12px ui-monospace,monospace}@media(max-width:840px){.card,.card.lead{g .agent-card{grid-column:span 6}.task-list{border-top:1px solid #243653;border-bottom:1px solid #243653;margin:4px 0 11px}.task-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #1c2b43;font-size:12px}.task-row:last-child{border-bottom:0}.task-status{border-radius:999px;padding:3px 7px;font-weight:700}.task-status.done{background:#183d35;color:#83f2c3}.task-status.failed{background:#482330;color:#ffadb6}.task-status.busy{background:#45371f;color:#ffd890}.task-main{color:#c9d7ec;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.task-main b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis}.task-main small{display:block;color:#8192ad;margin-top:3px}.task-time{color:#8192ad}@media(max-width:840px){.agent-card{grid-column:span 6}}@media(max-width:560px){.agent-card{grid-column:span 12}}.resource-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:0 0 24px}.resource-card{min-width:0;height:164px;display:flex;flex-direction:column;text-align:left;overflow:hidden;background:#101d31;border:1px solid #294464;border-radius:14px;padding:16px;cursor:pointer;color:var(--text);font:inherit;transition:border-color .18s,background .18s}.resource-card:hover{border-color:#609be7;background:#12223a}.resource-card .r-top{display:flex;align-items:center;justify-content:space-between;color:#91a6c5;font-size:13px;font-weight:650}.resource-card .r-live{font-size:11px;color:#6f88aa;font-weight:600}.resource-card .r-value{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:25px;line-height:1.15;font-weight:760;letter-spacing:-.045em;margin:10px 0 5px;color:#eef5ff}.resource-card.network .r-value{font-size:19px;letter-spacing:-.03em}.resource-card .r-sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;line-height:18px;color:#8499b8}.resource-meter{display:block;flex:0 0 auto;width:100%;height:4px;margin:13px 0 9px;border-radius:99px;overflow:hidden;background:#263a58}.resource-meter>span{display:block!important;height:4px!important;max-height:4px!important;border-radius:99px;background:#47dca0}.resource-card.warning .resource-meter>span{background:#f0bc65}.resource-card.danger .resource-meter>span{background:#fa7483}.resource-spark{display:block!important;width:100%!important;height:25px!important;min-height:25px!important;max-height:25px!important;margin-top:auto;overflow:visible}.resource-spark path{fill:none!important;stroke:#62a5fa!important;stroke-width:2!important;vector-effect:non-scaling-stroke}.resource-card.warning .resource-spark path{stroke:#f0bc65!important}.resource-card.danger .resource-spark path{stroke:#fa7483!important}.resource-detail{width:min(850px,96vw)}.chart-row{margin:15px 0}.chart-head{display:flex;justify-content:space-between;color:#b8c8df;margin-bottom:7px}.large-spark{width:100%;height:150px;background:#091322;border:1px solid #213653;border-radius:10px}.large-spark path{fill:none;stroke:#65aaff;stroke-width:2.4}.large-spark .gridline{stroke:#253957;stroke-width:1}.resource-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#91a4c2}.legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#65aaff}@media(max-width:840px){.resource-strip{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.resource-strip{grid-template-columns:1fr}.resource-card{height:151px}}.agent-panel{background:linear-gradient(145deg,#111e34,#0d1728);border:1px solid var(--line);border-radius:18px;padding:14px}.agent-tabs{display:flex;gap:8px;border-bottom:1px solid #243653;padding-bottom:12px}.agent-tab{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:1px solid #2b4262;border-radius:12px;background:#0c1728;color:#9fb0c9;padding:12px 15px;cursor:pointer;text-align:left;font:inherit}.agent-tab span{font-weight:800;font-size:15px}.agent-tab small{font-size:12px;color:#7185a4}.agent-tab.active{border-color:#5a9cff;background:#1c4f91;color:#fff;box-shadow:0 0 0 2px #4389e844}.agent-tab.active small{color:#c8e0ff}.agent-panel .card{box-shadow:none;border:0;border-radius:0;background:transparent;padding:18px 4px 5px;min-height:205px}.agent-panel .card:before{display:none}.agent-panel .agent-card{grid-column:span 12}@media(max-width:560px){.agent-tabs{display:grid;grid-template-columns:1fr}.agent-tab{width:100%}}.auto-refresh{color:#7f96b8;font-size:12px;padding:0 4px}.toolbar label.token-label{display:none}@media(max-width:560px){.shell{padding:20px 14px 38px}.hero{padding-bottom:19px}.eyebrow{font-size:11px;letter-spacing:.12em}.hero h1{font-size:31px;margin:8px 0}.hero p{font-size:14px;margin:0}.health{margin-top:17px;width:100%;box-sizing:border-box;padding:14px 16px}.resource-strip{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 17px}.resource-card{box-sizing:border-box;height:143px;padding:13px;border-radius:13px}.resource-card .r-top{font-size:12px}.resource-card .r-live{font-size:10px}.resource-card .r-value{font-size:20px;line-height:1.18;margin:8px 0 4px}.resource-card .mobile-value{display:none}.resource-card.network .r-value{font-size:15px;letter-spacing:-.045em;white-space:normal;line-height:1.3}.resource-card.network .desktop-value{display:none}.resource-card.network .mobile-value{display:block}.resource-card .capacity .desktop-value{display:none}.resource-card .capacity .mobile-value{display:inline}.resource-card .r-sub{font-size:11px;line-height:16px}.resource-meter{margin:10px 0 7px}.resource-spark{height:21px!important;min-height:21px!important;max-height:21px!important}.toolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;padding:12px;margin-bottom:22px}.toolbar label.token-label{display:block;grid-column:1/-1;font-size:12px;color:#93a7c6;font-weight:650;margin:0 1px -3px}.toolbar input{grid-column:1/-1;min-width:0;width:100%;box-sizing:border-box;height:42px}.toolbar .btn{min-width:0;width:100%;padding:0 8px;height:42px;font-size:14px}.toolbar .auto-refresh{display:block;grid-column:1/-1;align-self:center;text-align:center;font-size:11px;line-height:1.3;padding:2px 0 0}.toolbar .notice{grid-column:1/-1;min-height:0;font-size:12px}.section-head{align-items:baseline;margin:25px 0 11px;gap:10px}.section-head h2{font-size:21px;white-space:nowrap}.section-head span{font-size:12px;text-align:right;line-height:1.35}.agent-panel{padding:11px}.agent-tab{padding:11px 12px}.agent-panel .card{padding:15px 1px 3px}.modal{padding:12px}.modal-box{box-sizing:border-box;max-height:90vh;padding:17px;border-radius:15px}.modal-actions{display:grid;grid-template-columns:1fr 1fr}.modal-actions .btn{min-width:0}.large-spark{height:120px}.task-row{grid-template-columns:auto minmax(0,1fr);gap:7px}.task-time{grid-column:2;font-size:11px}.card,.card.lead{grid-column:span 12}}
</style><body><main class="shell"><header class="hero"><div><div class="eyebrow">Debian · monitoring & controlled actions</div><h1 id="dashboard-name">服务监控面板</h1><p id="meta">正在读取服务状态…</p></div><div id="health" class="health"><small>系统概览</small><strong>检查中</strong></div></header><section id="resources" class="resource-strip" aria-label="实时资源概览"></section><section class="toolbar"><label class="token-label" for="token">控制令牌（仅用于启动、重启与日志）</label><input id="token" type="password" autocomplete="off" placeholder="输入控制令牌，解锁启动、重启与日志"><button class="btn" onclick="saveToken()">保存令牌</button><button class="btn" onclick="clearToken()">清除令牌</button><button class="btn" onclick="load(true)">↻ 刷新状态</button><span class="auto-refresh">自动刷新 · 服务 5 秒 / 资源 3 秒</span><span id="notice" class="notice"></span></section><div class="section-head"><h2>核心服务</h2><span>业务入口与远程协作能力</span></div><section id="core" class="grid"></section><div class="section-head"><h2>Agent 运行</h2><span>当前服务器上的任务来源</span></div><section class="agent-panel"><nav class="agent-tabs"><button id="tab-codex" class="agent-tab active" onclick="switchAgent('codex')"><span>Codex CLI</span><small>原生执行引擎</small></button><button id="tab-multica" class="agent-tab" onclick="switchAgent('multica')"><span>Multica 编排任务</span><small>任务调度来源</small></button></nav><div id="agent-view"></div></section><div class="section-head"><h2>浏览器会话组件</h2><span>共同构成一个远程浏览器会话</span></div><section id="components" class="grid"></section></main><div id="modal" class="modal"><section class="modal-box"><h3 id="modalTitle"></h3><p id="modalText"></p><pre id="logBox" hidden></pre><div class="modal-actions"><button type="button" id="closeModalBtn" class="btn" onclick="closeModal()">关闭</button><button type="button" id="confirmBtn" class="btn primary" hidden>确认操作</button></div></section></div><script>
const token=document.querySelector('#token'),notice=document.querySelector('#notice'),modal=document.querySelector('#modal'),modalTitle=document.querySelector('#modalTitle'),modalText=document.querySelector('#modalText'),logBox=document.querySelector('#logBox'),confirmBtn=document.querySelector('#confirmBtn'),closeModalBtn=document.querySelector('#closeModalBtn'),TOKEN_KEY='jiankong-token';token.value=localStorage.getItem(TOKEN_KEY)||'';let data=null;function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}function say(s){notice.textContent=s;clearTimeout(window.nt);window.nt=setTimeout(()=>notice.textContent='',4200)}function saveToken(){if(!token.value.trim())return clearToken();localStorage.setItem(TOKEN_KEY,token.value);say('令牌已保存')}function clearToken(){token.value='';localStorage.removeItem(TOKEN_KEY);say('已清除保存的令牌')}token.addEventListener('input',()=>{if(token.value.trim())localStorage.setItem(TOKEN_KEY,token.value)});async function api(path,opt={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);try{opt.headers={...(opt.headers||{}),'X-Jiankong-Token':token.value};opt.signal=controller.signal;const r=await fetch(path,opt),d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}finally{clearTimeout(timer)}}function openModal(t,x){modalTitle.textContent=t;modalText.textContent=x;logBox.hidden=true;logBox.className='';confirmBtn.hidden=true;confirmBtn.disabled=false;confirmBtn.textContent='确认操作';confirmBtn.onclick=null;closeModalBtn.textContent='关闭';modal.classList.add('show')}function closeModal(){modal.classList.remove('show');confirmBtn.onclick=null;confirmBtn.disabled=false}function action(item,act){if(!item)return say('找不到要操作的服务');if(!token.value.trim())return say('请先输入控制令牌');const label=act==='start'?'启动':'重启';openModal(`确认${label}：${item.title}`,`确认后将执行“${label}${item.title}”。仅影响该服务，不修改项目代码、环境变量或其他服务。`);closeModalBtn.textContent='取消';confirmBtn.hidden=false;confirmBtn.textContent=`确认${label}`;confirmBtn.onclick=async()=>{confirmBtn.disabled=true;confirmBtn.textContent=`正在${label}…`;modalText.textContent=`正在执行${label}，请稍候…`;try{const r=await api('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:item.key,action:act})});closeModal();say(r.message||`${label}请求已提交`);setTimeout(()=>load(true),900)}catch(e){modalText.textContent=`${label}失败：${e.message}`;confirmBtn.disabled=false;confirmBtn.textContent=`重试${label}`}}}async function logs(item){if(!token.value)return say('请先输入控制令牌');openModal(`${item.title} · 最近日志`,'读取最近 60 行日志…');try{const r=await api('/api/logs?target='+encodeURIComponent(item.key));logBox.textContent=r.log||'暂无日志';logBox.hidden=false;modalText.textContent='日志只读显示，不会执行任何操作。'}catch(e){modalText.textContent='读取失败：'+e.message}}function codexCard(x){const c=x.codex||{},m={idle:'当前空闲',direct_cli:'直接 CLI 运行中',multica_managed:'Multica 托管运行中'},recent=c.recent||[];const rows=recent.map(r=>`<div class="task-row"><span class="task-status done">${esc(r.source||'会话')}</span><span class="task-main"><b>${esc(r.summary||'常规 CLI 会话')}</b><small>工作目录：${esc(r.cwd||'未记录')}</small></span><span class="task-time">${esc((r.timestamp||'').replace('T',' ').replace('Z',''))}</span></div>`).join('');return `<article class="card lead ok agent-card"><div class="card-top"><div class="name">Codex CLI</div><span class="tag">${m[c.mode]||c.mode}</span></div><div class="desc">当前服务器的 Codex CLI · 会话数 ${recent.length} · 使用当前用户的本地会话目录。</div><div class="meta"><span class="pill">运行模式：${m[c.mode]||c.mode}</span><span class="pill">原生会话：${recent.length}</span></div><div class="task-list">${rows||'<div class="empty">尚无可读取的原生 CLI 会话记录</div>'}</div><div class="subnote">会话历史来自 ~/.codex/sessions；主标题为脱敏后的会话主题，仅显示来源、工作目录与时间，不显示会话 ID、提示词或输出。</div></article>`}
function taskCard(x){const t=x.tasks||{},run=t.running||0,recent=t.recent||[];const statusMap={running:'执行中',starting:'启动中',queued:'排队中',pending:'等待中',completed:'已完成',failed:'失败',cancelled:'已取消'};const rows=recent.map(r=>`<div class="task-row"><span class="task-status ${r.status==='completed'?'done':(r.status==='failed'?'failed':'busy')}">${statusMap[r.status]||r.status}</span><span class="task-main"><b>${esc(r.summary||'常规任务执行')}</b><small>父任务：${esc(r.parent_title||'未命名任务')} · 负责人：${esc(r.agent)}</small></span><span class="task-time">${esc((r.completed_at||r.started_at||r.created_at||'').replace('T',' ').replace('Z',''))}</span></div>`).join('');const empty=t.available===false?(t.error==='正在读取任务'?'历史记录正在后台读取…':`历史记录暂时无法读取：${t.error||'Multica 服务不可用'}`):'暂无任务记录';return `<article class="card lead ok agent-card"><div class="card-top"><div class="name">Multica 编排任务</div><span class="tag">${run?`${run} 个执行中`:'当前空闲'}</span></div><div class="desc">当前服务器的 Multica 编排 · ${t.agent_count||0} 个 Agent · ${run?'正在处理任务':'没有正在执行的任务'}</div><div class="meta"><span class="pill">当前执行：${run}</span><span class="pill">历史记录：${t.available===false?'暂不可读':recent.length}</span></div><div class="task-list">${rows||`<div class="empty">${empty}</div>`}</div><div class="subnote">主标题为本次执行摘要；父任务与负责人作为上下文。不展示完整提示词、评论、输出或凭据。</div></article>`}
function openBrowser(){if(!token.value.trim())return say('请先输入控制令牌，再打开远程浏览器');api('/api/browser-session',{method:'POST'}).then(r=>{const w=window.open(r.url,'_blank','noopener');if(!w)location.href=r.url}).catch(e=>say('无法打开远程浏览器：'+e.message))}function card(x,lead=false){const state=x.ok?'运行正常':x.state==='inactive'?'未启动':x.state==='degraded'?'链路不完整':'异常',stateText=({active:'运行中',inactive:'未启动',failed:'启动失败',degraded:'部分异常',unknown:'未知'})[x.state]||x.state,cls=x.ok?'ok':('');const links=x.key==='browser_session'?`<button class="btn primary" onclick="openBrowser()">打开远程浏览器</button>`:(x.url?`<a class="btn primary" target="_blank" href="${x.url}">${x.link_label||'打开服务'}</a>`:'');const actions=(x.actions||[]).map(a=>`<button class="btn ${a==='restart'?'danger':''}" onclick="action(data.items.find(i=>i.key==='${x.key}'),'${a}')">${a==='start'?'启动服务':'重启服务'}</button>`).join('');const log=x.key==='browser_session'||x.key==='production'?'':`<button class="btn" onclick="logs(data.items.find(i=>i.key==='${x.key}'))">查看详情 / 日志</button>`;return `<article class="card ${lead?'lead':''} ${cls} ${x.key==='browser_session'?'browser-session-card':''}"><div class="card-top"><div class="name">${esc(x.title)}</div><span class="tag">${state}</span></div><div class="desc">${esc(x.detail)}</div><div class="meta"><span class="pill">服务状态：${esc(stateText)}</span>${x.port?`<span class="pill">端口：${x.port}</span>`:''}</div><div class="actions">${links}${actions}${log}</div>${x.key==='production'?'<div class="subnote">未配置启动单元，不显示可能误导的控制操作。</div>':''}${x.key==='browser_session'?'<div class="subnote">入口依赖下方四项组件全部运行。</div><div class="subnote">局域网受保护入口：电脑与手机均可使用；需当前页面的控制令牌，不暴露浏览器网关端口。</div>':''}</article>`}function fmtBytes(n){const u=['B/s','KB/s','MB/s','GB/s'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}function fmtMem(n){const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}function spark(values,max=100){if(values.length<2)return '<svg class="resource-spark" viewBox="0 0 100 25" preserveAspectRatio="none"><path d="M0 19 L100 19" opacity=".35"/></svg>';const hi=Math.max(max,...values,1),pts=values.map((v,i)=>`${(i/(values.length-1)*100).toFixed(1)},${(22-v/hi*18).toFixed(1)}`).join(' L');return `<svg class="resource-spark" viewBox="0 0 100 25" preserveAspectRatio="none"><path d="M${pts}"/></svg>`}function resourceCard(key,title,value,sub,pct,state,values,warming){return `<button class="resource-card ${key} ${state}" onclick="resourceDetail('${key}')"><span class="r-top"><span>${title}</span><span class="r-live">${warming?'采样中':'实时 · 60 秒'}</span></span><strong class="r-value">${value}</strong><span class="r-sub">${sub}</span>${pct!==null?`<span class="resource-meter"><span style="width:${Math.min(100,pct)}%"></span></span>`:'<span style="height:17px"></span>'}${spark(values)}</button>`}let resourceData=null;function renderResources(r){resourceData=r;const v=r.recent||[],warm=v.length<18,cpu=v.map(x=>x.cpu),mem=v.map(x=>x.memory),disk=v.map(x=>x.disk),net=v.map(x=>x.down+x.up);const a=r.sample,measuring=v.length<2,mobile=innerWidth<=560,capacity=(x)=>mobile?`${(x.used/1073741824).toFixed(1)} / ${(x.total/1073741824).toFixed(1)} GB`:`${fmtMem(x.used)} / ${fmtMem(x.total)}`,network=measuring?'采集中':mobile?`↓ ${fmtBytes(r.network.down)}<br>↑ ${fmtBytes(r.network.up)}`:`↓ ${fmtBytes(r.network.down)} · ↑ ${fmtBytes(r.network.up)}`;resources.innerHTML=resourceCard('cpu','CPU',measuring?'采集中':a.cpu+'%',measuring?'正在建立第一个有效样本':'使用率',measuring?0:a.cpu,r.cpu.state,cpu,warm)+resourceCard('memory','内存',capacity(r.memory),`${a.memory}% 已使用`,a.memory,r.memory.state,mem,warm)+resourceCard('disk','磁盘',capacity(r.disk),`${a.disk}% 已使用`,a.disk,r.disk.state,disk,warm)+resourceCard('network','网络',network,measuring?`正在识别活动网卡 · ${r.network.iface}`:`活动网卡 · ${r.network.iface}`,null,r.network.state,net,warm)}function resourceDetail(key){if(!resourceData)return;const r=resourceData,h=r.hour||[],cfg={cpu:['CPU 使用率','cpu','%'],memory:['内存使用率','memory','%'],disk:['磁盘使用率','disk','%'],network:['网络总吞吐','net','B/s']}[key];const vals=h.map(x=>key==='network'?x.down+x.up:x[cfg[1]]),max=key==='network'?Math.max(...vals,1):100,w=760,hh=150,pts=vals.map((v,i)=>`${(i/Math.max(1,vals.length-1)*w).toFixed(1)},${(hh-12-v/max*(hh-26)).toFixed(1)}`).join(' L');openModal(`${cfg[0]} · 最近 1 小时`, `每 3 秒采样一次；数据仅保留在监控服务内存中，重启后清空。当前：${key==='network'?`↓ ${fmtBytes(r.network.down)} · ↑ ${fmtBytes(r.network.up)}`:r.sample[cfg[1]]+cfg[2]}`);logBox.hidden=false;logBox.className='large-spark';logBox.innerHTML=`<svg viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none"><path class="gridline" d="M0 30H${w} M0 75H${w} M0 120H${w}"/><path d="M${pts}"/></svg>`}async function loadResources(){try{renderResources(await api('/api/resources'))}catch(e){console.warn(e)}}
let agentMode='codex';function switchAgent(mode){agentMode=mode;document.querySelector('#tab-codex').classList.toggle('active',mode==='codex');document.querySelector('#tab-multica').classList.toggle('active',mode==='multica');if(data)renderAgent()}function renderAgent(){const x=data.items.find(i=>i.key===(agentMode==='codex'?'codex_cli':'agent_tasks'));document.querySelector('#agent-view').innerHTML=agentMode==='codex'?codexCard(x):taskCard(x)}async function load(manual=false){if(manual)say('正在刷新状态…');try{data=await api('/api/status');const bad=data.items.filter(x=>x.category==='service'&&!x.ok),h=document.querySelector('#health');document.querySelector('#dashboard-name').textContent=data.dashboard_name||'服务监控面板';document.title=data.dashboard_name||'服务监控面板';document.querySelector('#meta').textContent=`主机 ${data.host} · 最后刷新 ${data.generated_at} · 监控端口 ${data.monitor_port}`;h.className='health '+(bad.length?'bad':'');h.innerHTML=`<small>系统概览</small><strong>${bad.length?`${bad.length} 项需要关注`:'自动发现服务正常'}</strong>`;const core=data.items.filter(x=>x.category==='service'),components=data.items.filter(x=>x.category==='component');document.querySelector('#core').innerHTML=core.length?core.map(x=>card(x,true)).join(''):'<article class="card lead neutral"><div class="card-top"><div class="name">未发现监听服务</div><span class="tag">等待中</span></div><div class="desc">当前服务器没有可识别的 TCP 监听端口。</div></article>';renderAgent();document.querySelector('#components').innerHTML=components.map(x=>card(x)).join('')}catch(e){const hasContent=typeof data!=='undefined'&&data;document.querySelector('#meta').textContent=hasContent?'暂时无法更新，正在自动重试…':'正在连接监控服务…';if(!hasContent)say('状态读取失败，正在自动重试')}}modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('show'))closeModal()});load();loadResources();setInterval(load,5000);setInterval(loadResources,3000);addEventListener('resize',()=>resourceData&&renderResources(resourceData))
</script></body></html>
