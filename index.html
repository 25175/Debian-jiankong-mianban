<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>服务监控面板</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<style>
:root{
  --bg:#f4f6fa; --bg-2:#eaeef5; --panel:#ffffff; --panel-2:#f8fafc;
  --line:#dde3ec; --line-2:#e8edf3;
  --text:#142238; --text-2:#4a5a72; --muted:#7c8ba1;
  --brand:#2f6fed; --brand-2:#e8f0ff;
  --good:#0d8a5f; --good-bg:#e3f6ee; --warn:#b07806; --warn-bg:#fdf3e0;
  --bad:#c93a4b; --bad-bg:#fdeaed; --neutral:#5b6b82; --neutral-bg:#eef1f6;
  --shadow:0 1px 2px rgba(20,34,56,.05),0 6px 18px rgba(20,34,56,.06);
  --radius:14px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0b111c; --bg-2:#0f1726; --panel:#131c2e; --panel-2:#18233a;
  --line:#233350; --line-2:#1c2a44;
  --text:#e8eefb; --text-2:#a9bad4; --muted:#7286a3;
  --brand:#5b9dff; --brand-2:#14263f;
  --good:#3ddc97; --good-bg:#0f2b22; --warn:#f0b94e; --warn-bg:#2c2410;
  --bad:#ff7d8f; --bad-bg:#311a20; --neutral:#9db0c8; --neutral-bg:#182236;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;transition:background .25s,color .25s}
button,input{font:inherit}

/* ---------- layout ---------- */
.shell{max-width:1280px;margin:0 auto;padding:22px 20px 64px}
.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--brand)}
h1{margin:5px 0 2px;font-size:26px;letter-spacing:-.01em}
.hero .meta{margin:0;color:var(--muted);font-size:12.5px}
.health{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 18px;box-shadow:var(--shadow);min-width:170px}
.health small{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em}
.health strong{font-size:16px}
.health.bad strong{color:var(--bad)}
.health:not(.bad) strong{color:var(--good)}
.egress-chip{display:none;flex-direction:column;gap:2px;text-align:left;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 16px;box-shadow:var(--shadow);color:inherit;transition:.15s;max-width:230px}
.egress-chip:hover{transform:translateY(-2px);border-color:var(--brand)}
.egress-chip small{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em}
.egress-chip strong{font-size:13px;font-weight:600;word-break:break-all}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:18px}
.topbar .spacer{flex:1}
.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--text-2);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.icon-btn.on{color:var(--brand);border-color:var(--brand);background:var(--brand-2)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13px;transition:.15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--panel-2);border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
html[data-theme="dark"] .btn.primary{color:#0b111c}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
html[data-theme="dark"] .btn.primary:hover{color:#0b111c}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.danger:hover{background:var(--bad-bg);color:var(--bad)}
.auto-refresh{font-size:11.5px;color:var(--muted)}
.notice{font-size:12.5px;color:var(--brand);min-height:18px}

/* ---------- resource strip ---------- */
.resource-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:20px}
.resource-card{min-width:0;display:flex;flex-direction:column;text-align:left;overflow:hidden;
  border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:13px 14px 10px;
  box-shadow:var(--shadow);cursor:pointer;color:inherit;transition:.15s}
.resource-card:hover{transform:translateY(-2px);border-color:var(--brand)}
.r-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);font-weight:700}
.r-live{font-weight:500;font-size:10.5px}
.r-value{font-size:20px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sub{font-size:11.5px;color:var(--text-2);word-break:break-word;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resource-meter{height:5px;border-radius:99px;background:var(--bg-2);margin-top:6px;overflow:hidden}
.resource-meter span{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .4s}
.resource-card.warning .r-value{color:var(--warn)}
.resource-card.danger .r-value{color:var(--bad)}
.resource-card.warning .resource-meter span{background:var(--warn)}
.resource-card.danger .resource-meter span{background:var(--bad)}
svg.resource-spark{width:100%;height:26px;margin-top:4px}
svg.resource-spark path{fill:none;stroke:var(--brand);stroke-width:1.6;vector-effect:non-scaling-stroke}

/* ---------- sections ---------- */
.section-head{display:flex;align-items:baseline;gap:12px;margin:22px 0 12px}
.section-head h2{font-size:16px;margin:0}
.section-head span{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;transition:.15s}
.card:hover{border-color:var(--line-2)}
.card.lead{grid-column:span 2}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card .name{font-weight:800;font-size:14.5px}
.card .desc{color:var(--text-2);font-size:12.5px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:11px;color:var(--text-2);background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:3px 9px}
.tag{font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.card.ok .tag{color:var(--good);background:var(--good-bg)}
.card:not(.ok):not(.neutral) .tag{color:var(--bad);background:var(--bad-bg)}
.card.neutral .tag{color:var(--neutral);background:var(--neutral-bg)}
.card.ok{border-left:3px solid var(--good)}
.card:not(.ok):not(.neutral){border-left:3px solid var(--bad)}
.card.neutral{border-left:3px solid var(--neutral)}
.card .actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.card .actions .btn{padding:6px 11px;font-size:12.5px}
.subnote{color:var(--muted);font-size:11px;line-height:1.5}
.task-list{display:flex;flex-direction:column;gap:5px;max-height:180px;overflow:auto}
.task-row{display:flex;gap:9px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:12px}
.task-status{font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 7px;flex-shrink:0}
.task-status.done{color:var(--good);background:var(--good-bg)}
.task-status.failed{color:var(--bad);background:var(--bad-bg)}
.task-status.busy{color:var(--warn);background:var(--warn-bg)}
.task-main{flex:1;min-width:0;display:flex;flex-direction:column}
.task-main b{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-main small{color:var(--muted);font-size:10.5px}
.task-time{color:var(--muted);font-size:10.5px;flex-shrink:0}
.empty{color:var(--muted);font-size:12px;padding:8px 0;text-align:center}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,16,28,.55);backdrop-filter:blur(3px);z-index:100;padding:16px}
.modal.show{display:flex}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.3);max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:20px}
.modal-box h3{margin:0 0 8px;font-size:16px}
.modal-box p{margin:0 0 10px;color:var(--text-2);font-size:13px;white-space:pre-wrap}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.modal pre{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text-2);font:11.5px ui-monospace,monospace;overflow:auto;max-height:50vh;margin:0}
.modal pre.large-spark{max-height:none}
.modal svg.gridline{stroke:var(--line)}
.modal svg path{fill:none;stroke:var(--brand);stroke-width:2;vector-effect:non-scaling-stroke}

@media(max-width:1100px){.resource-strip{grid-template-columns:repeat(3,1fr)}.card.lead{grid-column:span 1}}
@media(max-width:760px){
  .shell{padding:12px 10px 44px}
  h1{font-size:20px}
  .hero{gap:12px;margin-bottom:12px}
  .health{padding:9px 12px;min-width:0;flex:1 1 auto}
  .egress-chip{display:none;flex:0 0 auto;max-width:200px;padding:9px 11px}
  .egress-chip small{font-size:9.5px}
  .egress-chip strong{font-size:11.5px}
  .resource-strip{grid-template-columns:1fr 1fr;gap:9px}
  .resource-card{padding:10px 11px 8px}
  .r-value{font-size:16px}
  .topbar{padding:8px 9px;gap:7px;margin-bottom:12px}
  /* 服务 / 插件 / 组件网格：小屏 2 列紧凑，不再一卡片一行 */
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .card{padding:11px 12px;gap:6px}
  .card .name{font-size:13px}
  .card .desc{font-size:11.5px}
  .card .actions .btn{padding:5px 9px;font-size:11.5px}
  .card.lead{grid-column:span 2}
  .pill{font-size:10px;padding:2px 7px}
  .icon-btn{padding:6px 9px}
}
@media(max-width:480px){
  .resource-strip{grid-template-columns:1fr 1fr}
  .r-sub{font-size:10.5px}
  .topbar{border-radius:10px}
  .card .actions{gap:5px}
}

/* Responsive dashboard refinement: preserve critical values and touch targets. */
.shell{width:min(100%,1440px);max-width:1440px}
.resource-strip{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.resource-card{padding:12px 13px 10px}
.r-value{min-width:0;white-space:normal;overflow-wrap:anywhere;line-height:1.28;font-size:clamp(15px,1.35vw,19px)}
.r-sub{white-space:normal;overflow-wrap:anywhere;line-height:1.4;min-height:2.8em;display:block;overflow:visible;text-overflow:clip}
.btn,.icon-btn{min-height:40px}
.topbar .notice{flex-basis:100%;min-height:0}
.card{min-width:0}
.card .name,.card .desc,.card .pill,.card .task-time{overflow-wrap:anywhere}
@media(max-width:1100px){.resource-strip{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){
 .hero>div:last-child{flex:0 0 100%;width:100%;min-width:0;flex-wrap:nowrap;gap:8px}
 .hero>div:last-child>.health{flex:1 1 0;min-width:0}
 .hero>div:last-child>.health strong{font-size:clamp(11px,4.55vw,16px);white-space:nowrap}
 .hero>div:last-child>.egress-chip{flex:1 1 0;min-width:0;max-width:none}
 .shell{padding:12px 12px calc(28px + env(safe-area-inset-bottom))}
 .hero{gap:10px}
 .hero .meta{max-width:100%;overflow-wrap:anywhere}
 .health{flex:1 1 100%}
 .resource-strip{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .resource-card{min-height:148px}
 .r-value{font-size:16px;line-height:1.3}
 .r-sub{-webkit-line-clamp:3;min-height:3.9em}
 .topbar{gap:6px;padding:8px}
 .btn,.icon-btn{min-height:44px}
 .topbar>.spacer{display:none}
 .topbar .btn,.topbar .icon-btn{flex:1 1 auto;justify-content:center}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .card{padding:10px;gap:6px}
 .card .card-top{align-items:flex-start;flex-wrap:wrap}
 .card .actions .btn{min-height:44px;flex:1 1 auto;justify-content:center}
 .card.lead{grid-column:span 2}
 .task-row{flex-wrap:wrap}
 .task-time{margin-left:auto}
 .section-head{gap:6px;flex-wrap:wrap}
 .section-head span{flex-basis:100%}
}
@media(max-width:380px){
 .shell{padding-left:8px;padding-right:8px}
 .resource-strip{gap:7px}
 .resource-card{padding:9px;min-height:156px}
 .topbar>.btn,.topbar>.icon-btn{flex-basis:calc(50% - 6px)}
 .grid{grid-template-columns:1fr}
 .card.lead{grid-column:auto}
 .section-head h2{font-size:15px}
}
/* ---------- login page ---------- */
.login-page[hidden]{display:none!important}
.login-page{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.login-box{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--24shadow,0 24px 60px rgba(0,0,0,.18));max-width:380px;width:100%;padding:32px 28px;display:flex;flex-direction:column;gap:6px}
.login-box h1{font-size:22px;margin:4px 0 2px}
.login-hint{margin:0 0 10px;color:var(--muted);font-size:12.5px}
#loginPassword{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;outline:0;font:inherit}
#loginPassword:focus{border-color:var(--brand)}
.login-btn{margin-top:14px;width:100%;justify-content:center;padding:11px}
.login-error{margin-top:10px;color:var(--bad);font-size:12.5px;min-height:16px}
</style>
<body>
<div id="loginPage" class="login-page">
  <form class="login-box" id="loginForm" autocomplete="off">
    <div class="eyebrow">服务监控 · MONITORING</div>
    <h1>服务监控面板</h1>
    <p class="login-hint">请输入登录密码</p>
    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="登录密码" autofocus>
    <button class="btn primary login-btn" type="submit">登录</button>
    <div id="loginError" class="login-error"></div>
  </form>
</div>
<main class="shell" id="appMain" hidden>
  <header class="hero">
    <div>
      <div class="eyebrow">服务监控 · MONITORING</div>
      <h1 id="dashboard-name">服务监控面板</h1>
      <p class="meta" id="meta">正在读取服务状态…</p>
    </div>
    <div style="display:flex;gap:10px;align-items:stretch;flex-wrap:wrap">
      <div id="health" class="health"><small>系统概览</small><strong>检查中</strong></div>
      <button id="egress-chip" class="egress-chip" onclick="resourceDetail('public-network')" title="国内 / 国际出口 IP">
        <small>国内 / 国际出口</small><strong>查询中</strong>
      </button>
    </div>
  </header>

  <section id="resources" class="resource-strip" aria-label="实时资源概览"></section>

  <section class="topbar">
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="切换深色 / 浅色"></button>
    <span class="auto-refresh">自动刷新 · 服务 5s / 资源 3s</span>
    <span class="spacer"></span>
    <button class="btn" onclick="logout()" title="退出登录">退出登录</button>
    <button class="btn" onclick="load(true)">↻ 刷新</button>
    <span id="notice" class="notice"></span>
  </section>

  <div class="section-head"><h2>监控插件</h2><span>按需一键安装，安装后出现独立管理入口</span></div>
  <section id="plugins" class="grid"></section>
  <div class="section-head"><h2>核心服务</h2><span>业务入口与远程协作能力</span></div>
  <section id="core" class="grid"></section>
  <div class="section-head"><h2>Agent 运行</h2><span>按当前设备实际安装与运行情况自动扫描</span></div>
  <section id="agent-view" class="grid"></section>
  <div class="section-head"><h2>浏览器会话组件</h2><span>共同构成一个远程浏览器会话</span></div>
  <section id="components" class="grid"></section>
</main>

<div id="modal" class="modal"><section class="modal-box">
  <h3 id="modalTitle"></h3><p id="modalText"></p><pre id="logBox" hidden></pre>
  <div class="modal-actions">
    <button type="button" id="closeModalBtn" class="btn" onclick="closeModal()">关闭</button>
    <button type="button" id="confirmBtn" class="btn primary" hidden>确认操作</button>
  </div>
</section></div>

<script>
const notice=document.querySelector('#notice'),modal=document.querySelector('#modal'),modalTitle=document.querySelector('#modalTitle'),modalText=document.querySelector('#modalText'),logBox=document.querySelector('#logBox'),confirmBtn=document.querySelector('#confirmBtn'),closeModalBtn=document.querySelector('#closeModalBtn'),TOKEN_KEY='jiankong-token',THEME_KEY='jiankong-theme';
let token={value:localStorage.getItem(TOKEN_KEY)||''};
let data=null;

/* ---------- login gate ---------- */
const loginPage=document.querySelector('#loginPage'),appMain=document.querySelector('#appMain'),loginForm=document.querySelector('#loginForm'),loginPassword=document.querySelector('#loginPassword'),loginError=document.querySelector('#loginError');
function showApp(){loginPage.hidden=true;appMain.hidden=false;load();loadResources()}
function showLogin(){const wasHidden=loginPage.hidden;loginPage.hidden=false;appMain.hidden=true;if(wasHidden){loginError.textContent='';loginPassword.focus()}}
function logout(){localStorage.removeItem(TOKEN_KEY);token.value='';loginPassword.value='';showLogin()}
let loginAttempt=0;
loginForm.addEventListener('submit',async e=>{e.preventDefault();const v=loginPassword.value;if(!v){loginError.textContent='请输入登录密码';return}const attempt=++loginAttempt;const submit=loginForm.querySelector('[type="submit"]');if(submit)submit.disabled=true;loginError.textContent='正在验证…';try{await api('/api/status',{},v);if(attempt!==loginAttempt)return;token.value=v;localStorage.setItem(TOKEN_KEY,v);loginError.textContent='';loginPassword.value='';showApp()}catch(err){if(attempt===loginAttempt)loginError.textContent='登录失败：'+(err.message||'验证未成功')}finally{if(attempt===loginAttempt&&submit)submit.disabled=false}});
addEventListener('storage',e=>{if(e.key!==TOKEN_KEY)return;token.value=e.newValue||'';if(token.value)showApp();else showLogin()});
if(token.value)showApp();else showLogin();

/* ---------- theme: auto / light / dark ---------- */
function applyTheme(t){
  const auto=!t||t==='auto';
  const dark=auto?matchMedia('(prefers-color-scheme:dark)').matches:t==='dark';
  document.documentElement.dataset.theme=dark?'dark':'light';
  document.querySelector('#themeBtn').textContent=auto?'◐ 跟随设备':(dark?'☾ 深色':'☀ 浅色');
}
function toggleTheme(){
  const cur=localStorage.getItem(THEME_KEY)||'auto';
  const next=cur==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark'):(cur==='dark'?'light':'dark');
  localStorage.setItem(THEME_KEY,next);applyTheme(next);say('已切换为'+(next==='dark'?'深色':'浅色')+'模式');
}
applyTheme(localStorage.getItem(THEME_KEY)||'auto');
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if((localStorage.getItem(THEME_KEY)||'auto')==='auto')applyTheme('auto')});

function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
function say(s){notice.textContent=s;clearTimeout(window.nt);window.nt=setTimeout(()=>notice.textContent='',4200)}
async function api(path,opt={},authToken=token.value){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),path.includes('plugins/toggle')&&opt.method==='POST'?900000:8000);try{opt.headers={...(opt.headers||{}),'X-Jiankong-Token':authToken};opt.signal=controller.signal;const r=await fetch(path,opt),t=await r.text();let d=null,invalidJson=false;try{d=t?JSON.parse(t):{}}catch(e){invalidJson=true;const detail=t.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,300);d={error:detail||'服务返回了无法解析的响应（可能是网关错误页）'}}if(!r.ok||invalidJson){const err=new Error((d&&d.error)||`HTTP ${r.status} 请求失败`);err.status=r.status;if(r.status===401&&authToken===token.value&&token.value){localStorage.removeItem(TOKEN_KEY);token.value='';showLogin();loginError.textContent='登录状态已失效：'+err.message}throw err}return d}finally{clearTimeout(timer)}}
function requireToken(){if(token.value.trim())return true;showLogin();return false}
function openModal(t,x){modalTitle.textContent=t;modalText.textContent=x;logBox.hidden=true;logBox.className='';confirmBtn.hidden=true;confirmBtn.disabled=false;confirmBtn.textContent='确认操作';confirmBtn.onclick=null;closeModalBtn.textContent='关闭';modal.classList.add('show')}
function closeModal(){modal.classList.remove('show');confirmBtn.onclick=null;confirmBtn.disabled=false}
function action(item,act){if(!item)return say('找不到要操作的服务');if(!token.value.trim())return showLogin();const label=act==='start'?'启动':act==='restart'?'重启':act==='persist-stop'?'保持停止':act==='persist-allow'?'恢复运行':'停止';const managed=item.managed===true,stopNote=(act==='stop'||act==='persist-stop')?(managed?'\n\n该服务由平台守护进程管理，停止后会自动恢复。':'\n\n注意：该服务由系统启动进程直接拉起，停止后不会自动恢复，需要登录 VM 手动重新启动。'):'';openModal(`确认${label}：${item.title}`,`确认后将执行“${label}${item.title}”。仅影响该服务，不修改项目代码、环境变量或其他服务。${stopNote}${act==='persist-stop'?"\n\n开启后监控服务每 3 秒检查一次，平台每次重新拉起该进程都立即停止它，直到点击“恢复运行”。":''}`);closeModalBtn.textContent='取消';confirmBtn.hidden=false;confirmBtn.textContent=`确认${label}`;confirmBtn.onclick=async()=>{confirmBtn.disabled=true;confirmBtn.textContent=`正在${label}…`;modalText.textContent=`正在执行${label}，请稍候…`;try{const r=await api('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:item.key,action:act})});closeModal();say(r.message||`${label}请求已提交`);setTimeout(()=>load(true),900)}catch(e){modalText.textContent=`${label}失败：${e.message}`;confirmBtn.disabled=false;confirmBtn.textContent=`重试${label}`}}}
async function logs(item){if(!token.value)return showLogin();openModal(`${item.title} · 最近日志`,'读取最近 60 行日志…');try{const r=await api('/api/logs?target='+encodeURIComponent(item.key));logBox.textContent=r.log||'暂无日志';logBox.hidden=false;modalText.textContent='日志只读显示，不会执行任何操作。'}catch(e){modalText.textContent='读取失败：'+e.message}}
function openBrowser(){if(!token.value.trim())return showLogin();api('/api/browser-session',{method:'POST'}).then(r=>{const w=window.open(r.url,'_blank');if(!w){say('浏览器拦截了弹窗，正在本页打开…');location.href=r.url}}).catch(e=>say('无法打开远程浏览器：'+e.message))}
function codexCard(x){const c=x.codex||{},m={idle:'当前空闲',direct_cli:'直接 CLI 运行中',multica_managed:'Multica 托管运行中'},recent=c.recent||[];const rows=recent.map(r=>`<div class="task-row"><span class="task-status done">${esc(r.source||'会话')}</span><span class="task-main"><b>${esc(r.summary||'常规 CLI 会话')}</b><small>工作目录：${esc(r.cwd||'未记录')}</small></span><span class="task-time">${esc((r.timestamp||'').replace('T',' ').replace('Z',''))}</span></div>`).join('');return `<article class="card lead ok"><div class="card-top"><div class="name">Codex CLI</div><span class="tag">${m[c.mode]||c.mode}</span></div><div class="desc">当前服务器的 Codex CLI · 会话数 ${recent.length} · 使用当前用户的本地会话目录。</div><div class="meta"><span class="pill">运行模式：${m[c.mode]||c.mode}</span><span class="pill">原生会话：${recent.length}</span></div><div class="task-list">${rows||'<div class="empty">尚无可读取的原生 CLI 会话记录</div>'}</div><div class="subnote">会话历史来自 ~/.codex/sessions；主标题为脱敏后的会话主题，仅显示来源、工作目录与时间，不显示会话 ID、提示词或输出。</div></article>`}
function taskCard(x){const t=x.tasks||{},run=t.running||0,recent=t.recent||[];const statusMap={running:'执行中',starting:'启动中',queued:'排队中',pending:'等待中',completed:'已完成',failed:'失败',cancelled:'已取消'};const rows=recent.map(r=>`<div class="task-row"><span class="task-status ${r.status==='completed'?'done':(r.status==='failed'?'failed':'busy')}">${statusMap[r.status]||r.status}</span><span class="task-main"><b>${esc(r.summary||'常规任务执行')}</b><small>父任务：${esc(r.parent_title||'未命名任务')} · 负责人：${esc(r.agent)}</small></span><span class="task-time">${esc((r.completed_at||r.started_at||r.created_at||'').replace('T',' ').replace('Z',''))}</span></div>`).join('');const empty=t.available===false?(t.error==='正在读取任务'?'历史记录正在后台读取…':`历史记录暂时无法读取：${t.error||'Multica 服务不可用'}`):'暂无任务记录';return `<article class="card lead ok"><div class="card-top"><div class="name">Multica 编排任务</div><span class="tag">${run?`${run} 个执行中`:'当前空闲'}</span></div><div class="desc">当前服务器的 Multica 编排 · ${t.agent_count||0} 个 Agent · ${run?'正在处理任务':'没有正在执行的任务'}</div><div class="meta"><span class="pill">当前执行：${run}</span><span class="pill">历史记录：${t.available===false?'暂不可读':recent.length}</span></div><div class="task-list">${rows||`<div class="empty">${empty}</div>`}</div><div class="subnote">主标题为本次执行摘要；父任务与负责人作为上下文。不展示完整提示词、评论、输出或凭据。</div></article>`}
function card(x,lead=false){const state=x.ok?'运行正常':x.state==='inactive'?'未启动':x.state==='degraded'?'链路不完整':'异常',stateText=({active:'运行中',inactive:'未启动',failed:'启动失败',degraded:'部分异常',unknown:'未知'})[x.state]||x.state,cls=x.ok?'ok':('');const links=x.key==='browser_session'?`<button class="btn primary" onclick="openBrowser()">打开远程浏览器</button>`:(x.url?`<a class="btn primary" target="_blank" href="${x.url}">${x.link_label||'打开服务'}</a>`:'');const persistOn=(data.persist_stop||[]).includes(x.key),actions=(x.actions||[]).map(a=>{const lbl=a==='start'?'启动服务':a==='restart'?'重启服务':a==='stop'?'停止服务':a==='persist-stop'?(persistOn?'✓ 保持停止中':'保持停止'):'恢复运行';return `<button class="btn ${a==='persist-stop'?(persistOn?'':'danger'):a==='persist-allow'?(persistOn?'primary':''):''}" ${a==='persist-stop'&&persistOn?'disabled':''} onclick="action(data.items.find(i=>i.key==='${x.key}'),'${a}')">${lbl}</button>`}).join('');const log=x.key==='browser_session'||x.key==='production'?'':`<button class="btn" onclick="logs(data.items.find(i=>i.key==='${x.key}'))">查看详情 / 日志</button>`;return `<article class="card ${lead?'lead':''} ${cls}"><div class="card-top"><div class="name">${esc(x.title)}</div><span class="tag">${state}</span></div><div class="desc">${esc(x.detail)}</div><div class="meta"><span class="pill">服务状态：${esc(stateText)}</span>${x.port?`<span class="pill">端口：${x.port}</span>`:''}${x.rss_bytes!=null?`<span class="pill">进程内存：${fmtMem(x.rss_bytes)}</span>`:''}</div><div class="actions">${links}${actions}${log}</div>${x.key==='production'?'<div class="subnote">未配置启动单元，不显示可能误导的控制操作。</div>':''}${x.key==='browser_session'?'<div class="subnote">入口依赖下方四项组件全部运行。</div><div class="subnote">局域网受保护入口：电脑与手机均可使用；需当前页面的登录密码，不暴露浏览器网关端口。</div>':''}</article>`}
function fmtBytes(n){const u=['B/s','KB/s','MB/s','GB/s'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}
function fmtMem(n){const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}
function spark(values){if(values.length<2)return '<svg class="resource-spark" viewBox="0 0 100 25" preserveAspectRatio="none"><path d="M0 19 L100 19" opacity=".35"/></svg>';const hi=Math.max(100,...values,1),pts=values.map((v,i)=>`${(i/(values.length-1)*100).toFixed(1)},${(22-v/hi*18).toFixed(1)}`).join(' L');return `<svg class="resource-spark" viewBox="0 0 100 25" preserveAspectRatio="none"><path d="M${pts}"/></svg>`}
function resourceCard(key,title,value,sub,pct,state,values,warming){return `<button class="resource-card ${state}" onclick="resourceDetail('${key}')"><span class="r-top"><span>${title}</span><span class="r-live">${warming?'采样中':'实时 · 60 秒'}</span></span><strong class="r-value">${value}</strong><span class="r-sub">${sub}</span>${pct!==null?`<span class="resource-meter"><span style="width:${Math.min(100,pct)}%"></span></span>`:'<span style="height:17px"></span>'}${spark(values)}</button>`}
let resourceData=null;
/* Small screens: the egress card is too wide for the 2-col resource strip, but
   folding its text into the health line would swallow the click target. Render
   it as a compact chip beside the health box instead — same click, same modal,
   no standalone card. */let egressHTML='';
function renderHealthEgress(pub,cn,intl){if(pub.error){egressHTML='出口查询不可用'}else if(!cn.ip&&!intl.ip){egressHTML='查询中'}else{egressHTML=`国内 ${cn.ip||'—'} · 国际 ${intl.ip||'—'}`}paintHealthEgress()}
function paintHealthEgress(){const chip=document.querySelector('#egress-chip');if(!chip)return;chip.querySelector('strong').textContent=egressHTML;chip.style.display=egressHTML?'flex':'none'}
function renderResources(r){resourceData=r;const v=r.recent||[],warm=v.length<18,cpu=v.map(x=>x.cpu),mem=v.map(x=>x.memory),disk=v.map(x=>x.disk),net=v.map(x=>x.down+x.up);const a=r.sample,measuring=v.length<2,mobile=innerWidth<=560,capacity=(x)=>mobile?`${(x.used/1073741824).toFixed(1)} / ${(x.total/1073741824).toFixed(1)} GB`:`${fmtMem(x.used)} / ${fmtMem(x.total)}`,network=measuring?'采集中':mobile?`↓ ${fmtBytes(r.network.down)}<br>↑ ${fmtBytes(r.network.up)}`:`↓ ${fmtBytes(r.network.down)} · ↑ ${fmtBytes(r.network.up)}`;const ma=r.memory.accounting||{},memorySub=ma.consistent?`${a.memory}% 已使用 · 可见进程 ${fmtMem(ma.visible_process_rss||0)}`:`系统口径 ${a.memory}% · 可见进程仅 ${fmtMem(ma.visible_process_rss||0)} · 平台记账差异 ${fmtMem(ma.unexplained_used||0)}`;const pub=r.network.public||{},cn=pub.domestic||{},intl=pub.international||{},pubState=pub.error?'warning':(cn.ip&&intl.ip?'ok':'warning'),pubValue=cn.ip?`国内 ${cn.ip}`:'查询中',pubSub=pub.error?'出口 IP 查询暂不可用':(intl.ip?`国际 ${intl.ip}`:'正在查询国内 / 国际出口');if(mobile){renderHealthEgress(pub,cn,intl)}else{const chip=document.querySelector('#egress-chip');if(chip)chip.style.display='none'};resources.innerHTML=resourceCard('cpu','CPU',measuring?'采集中':a.cpu+'%',measuring?'正在建立第一个有效样本':'使用率',measuring?0:a.cpu,r.cpu.state,cpu,warm)+resourceCard('memory','内存',capacity(r.memory),memorySub,a.memory,ma.consistent?r.memory.state:'warning',mem,warm)+resourceCard('disk','磁盘',capacity(r.disk),`${a.disk}% 已使用`,a.disk,r.disk.state,disk,warm)+resourceCard('network','网络',network,measuring?`正在识别活动网卡 · ${r.network.iface}`:`活动网卡 · ${r.network.iface}`,null,r.network.state,net,warm)+(mobile?'':resourceCard('public-network','国内 / 国际出口',pubValue,pubSub,null,pubState,[],false))}
function resourceDetail(key){if(!resourceData)return;const r=resourceData;if(key==='public-network'){const p=r.network?.public||{},cn=p.domestic||{},intl=p.international||{};openModal('国内 / 国际出口 IP',`国内出口 IP：${cn.ip||'查询中'}\n国内出口位置：${cn.location||'定位中'}\n国内服务商：${cn.isp||'服务未返回'}\n\n国际出口 IP：${intl.ip||'查询中'}\n国际出口位置：${intl.location||'定位中'}\n国际服务商：${intl.isp||'服务未返回'}${p.error?`\n\n查询说明：${p.error}`:''}`);return}const h=r.hour||[],cfg={cpu:['CPU 使用率','cpu','%'],memory:['内存使用率','memory','%'],disk:['磁盘使用率','disk','%'],network:['网络总吞吐','net','B/s']}[key];if(!cfg)return;const vals=h.map(x=>key==='network'?x.down+x.up:x[cfg[1]]),max=key==='network'?Math.max(...vals,1):100,w=760,hh=150,pts=vals.map((v,i)=>`${(i/Math.max(1,vals.length-1)*w).toFixed(1)},${(hh-12-v/max*(hh-26)).toFixed(1)}`).join(' L');openModal(`${cfg[0]} · 最近 1 小时`,`每 3 秒采样一次；数据仅保留在监控服务内存中，重启后清空。当前：${key==='network'?`↓ ${fmtBytes(r.network.down)} · ↑ ${fmtBytes(r.network.up)}`:r.sample[cfg[1]]+cfg[2]}`);logBox.hidden=false;logBox.className='large-spark';logBox.innerHTML=`<svg viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none"><path class="gridline" d="M0 30H${w} M0 75H${w} M0 120H${w}"/><path d="M${pts}"/></svg>`}
async function loadResources(){if(!requireToken())return;try{renderResources(await api('/api/resources'))}catch(e){console.warn(e)}}
async function browserAction(act,label){if(!token.value.trim())return showLogin();try{const r=await api('/api/login-browser/'+act,{method:'POST'});say(label+(r.ok!==false?'成功':'失败'),r.ok===false);load(true)}catch(e){say(label+'失败：'+e.message,true)}}
async function stopLoginBrowser(){if(!token.value.trim())return showLogin();openModal('确认停止：共享浏览器运行环境','将停止 Chromium、Xvfb、x11vnc、websockify 等浏览器运行组件。登录数据（Cookie / 会话）会保留在 VM 磁盘上，不会丢失；需要时可重新启动运行环境。');closeModalBtn.textContent='取消';confirmBtn.hidden=false;confirmBtn.textContent='确认停止';confirmBtn.onclick=async()=>{confirmBtn.disabled=true;confirmBtn.textContent='正在停止…';try{const r=await api('/api/login-browser/stop',{method:'POST'});closeModal();say('共享浏览器运行环境已停止，登录资料已保留');setTimeout(()=>load(true),900)}catch(e){modalText.textContent='停止失败：'+e.message;confirmBtn.disabled=false;confirmBtn.textContent='重试停止'}}}
async function togglePlugin(key){if(!token.value.trim())return showLogin();const p=pluginList.find(x=>x.key===key);if(!p)return say('找不到该插件');if(p.key==='monkeycode-login-browser'&&p.installed)return say('共享浏览器运行环境包含当前 VM 的登录资料，不提供网页卸载；可停止运行组件');const installing=!p.installed;if(installing)say('正在安装 '+p.name+'，可能需要 1-2 分钟，请勿离开…');try{const r=await api('/api/plugins/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:p.key,installed:!p.installed})});say(p.key==='monkeycode-login-browser'?'共享浏览器运行环境已安装并启动':'插件'+(p.installed?'已卸载':'已安装'));load(true)}catch(e){say('插件操作失败：'+e.message,true)}}
let pluginList=[];function renderPlugins(){const ps=data.plugins||[];pluginList=ps;document.querySelector('#plugins').innerHTML=ps.map(p=>{const rt=p.runtime||{},browser=p.key==='monkeycode-login-browser',state=browser?(p.installed?(rt.running&&rt.vnc&&rt.web?'已安装并运行':'已安装，待启动'):'未安装'):(p.installed?'已安装':'未安装'),extra=browser?`<span class="pill">${rt.running?'Chromium 已运行':'尚未启动浏览器'}</span>`:`<span class="pill">端口：${p.port}</span>`;return `<article class="card lead ${p.installed?'ok':'neutral'}"><div class="card-top"><div class="name">${esc(p.name)}</div><span class="tag">${state}</span></div><div class="desc">${esc(p.description)}</div><div class="meta"><span class="pill">路由：${esc(p.route)}</span>${extra}</div><div class="actions">${p.installed&&p.url?`<a class="btn primary" href="${p.url}">进入插件</a>`:''}${browser&&p.installed?`<button class="btn ${rt.running?'danger':'primary'}" onclick="stopLoginBrowser()">停止浏览器</button>${rt.running?'':`<button class="btn primary" onclick="browserAction('start','启动浏览器')">启动浏览器</button>`}`:`<button class="btn ${p.installed?'danger':'primary'}" onclick="togglePlugin('${p.key}')">${p.installed?'卸载插件':'一键安装'}</button>`}</div></article>`}).join('')}
function renderAgent(){const agents=data.agents||[];document.querySelector('#agent-view').innerHTML=agents.length?agents.map(a=>{const d=a.agent_data||{},installed=a.state==='installed'?'已安装':a.state==='running'?'运行中':a.state==='idle'?'空闲':a.state;return `<article class="card lead ok"><div class="card-top"><div class="name">${esc(a.title)}</div><span class="tag">${esc(installed)}</span></div><div class="desc">${esc(a.detail||'已由当前设备扫描发现')}</div><div class="meta"><span class="pill">类型：${esc(a.agent_kind)}</span><span class="pill">运行数：${d.running||0}</span>${Array.isArray(d.recent)?`<span class="pill">可读记录：${d.recent.length}</span>`:''}</div></article>`}).join(''):'<article class="card lead neutral"><div class="card-top"><div class="name">未发现 Agent 工具</div><span class="tag">扫描完成</span></div><div class="desc">当前设备未检测到 Codex、Multica、Claude Code、OpenCode、Gemini CLI 或 Aider。</div></article>'}
async function load(manual=false){if(!requireToken())return;if(manual)say('正在刷新状态…');try{data=await api('/api/status');const bad=data.items.filter(x=>x.category==='service'&&!x.ok),h=document.querySelector('#health');document.querySelector('#dashboard-name').textContent=data.dashboard_name||'服务监控面板';document.title=data.dashboard_name||'服务监控面板';document.querySelector('#meta').textContent=`主机 ${data.host} · 最后刷新 ${data.generated_at} · 监控端口 ${data.monitor_port}`;h.className='health '+(bad.length?'bad':'');h.innerHTML=`<small>系统概览</small><strong>${bad.length?`${bad.length} 项需要关注`:'自动发现服务正常'}</strong>`;const core=data.items.filter(x=>x.category==='service'),components=data.items.filter(x=>x.category==='component');document.querySelector('#core').innerHTML=core.length?core.map(x=>card(x,true)).join(''):'<article class="card lead neutral"><div class="card-top"><div class="name">未发现监听服务</div><span class="tag">等待中</span></div><div class="desc">当前服务器没有可识别的 TCP 监听端口。</div></article>';renderPlugins();renderAgent();document.querySelector('#components').innerHTML=components.map(x=>card(x)).join('')}catch(e){const hasContent=typeof data!=='undefined'&&data;document.querySelector('#meta').textContent=hasContent?'暂时无法更新，正在自动重试…':'正在连接监控服务…';if(!hasContent)say('状态读取失败，正在自动重试')}}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('show'))closeModal()});
load();loadResources();
/* Both polls hit the VM on a fixed timer; skip them while the tab is
   backgrounded so a parked dashboard stops forking ss / systemctl. */
setInterval(()=>{document.hidden||load()},5000);
setInterval(()=>{document.hidden||loadResources()},3000);
addEventListener('visibilitychange',()=>{if(!document.hidden){load();loadResources()}});
addEventListener('resize',()=>resourceData&&renderResources(resourceData));
</script>
</body>
</html>
